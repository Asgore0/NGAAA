name: Android build and regression checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Install test utilities
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Verify build environment
        run: bash build-local.sh --check
      - name: Build with an ephemeral development key
        env:
          SIGNING_DIR: ${{ runner.temp }}/ngaaa-ci-signing
        run: bash build-local.sh
      - name: Run offline regression suites
        run: |
          for suite in renderer api api/checkin session_scopes loginprefs checkin_service startup_tasks favorite_sync favorite_auto favorite_startup forum_response_cache forum_early_read forum_list screenreads thread_actions votes_state community forum_return topic_previews; do
            bash scripts/test.sh "$suite"
          done
      - name: Verify published performance calculations
        run: python3 scripts/verify-performance.py
