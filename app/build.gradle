plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.ngapure.app'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'cn.ngapure.app'
        minSdk 26
        targetSdk 35
        versionCode 49
        versionName '0.20.15'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// Android framework UI with the vendored MIT Nayuki QR encoder. No external runtime JARs.
